[package]
name = "tinkoff"
description = "Tinkoff investments console client"
repository = "https://github.com/aegoroff/tinkoff"
homepage = "https://github.com/aegoroff/tinkoff"
authors = ["egoroff <egoroff@gmail.com>"]
edition = "2024"
license = "MIT"
version = "0.1.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tinkoff-invest-api = { version = "0.3.0" }
tokio = {version = "1.53.1", features = ["full"]}
rust_decimal = "1.42.1"
rust_decimal_macros = "1.40.0"
iso_currency = "0.7.0"
itertools = "0.15.0"
indicatif = "0.18.6"
num-format = "0.4.4"
comfy-table = "8.0.0"
clap = { version = "4.6.6", features = ["std", "color", "cargo"] }
color-eyre = "0.6.5"
chrono = { version="0.4.45", default-features = false, features = ["clock", "std"] }
prost-types = "0.11.9"
tonic = { version = "0.8.3", features = ["tls", "tls-roots"] }

[target.'cfg(target_os = "linux")'.dependencies]
mimalloc = "0.1.52"

[dev-dependencies]
rstest = "0.27.0"

[profile.release]
lto = true
strip = true
panic = 'abort'

[lints.rust]
unsafe_code = "forbid"
