[package]
name = "tinkoff"
description = "Tinkoff investments console client"
repository = "https://github.com/aegoroff/tinkoff"
homepage = "https://github.com/aegoroff/tinkoff"
authors = ["egoroff <egoroff@gmail.com>"]
edition = "2024"
rust-version = "1.89"
license = "MIT"
version = "0.1.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
t-invest-sdk = "0.17.0"
tokio = {version = "1.54.1", features = ["full"]}
rust_decimal = { version = "1.43.0", features = ["maths"] }
rust_decimal_macros = "1.40.0"
iso_currency = "0.7.1"
itertools = "0.15.0"
indicatif = "0.18.6"
num-format = "0.4.4"
comfy-table = "8.0.1"
clap = { version = "4.6.7", features = ["std", "color", "cargo"] }
color-eyre = "0.6.5"
chrono = { version="0.4.45", default-features = false, features = ["clock", "std"] }
prost-types = "0.14.4"
tonic = { version = "0.14.7", features = ["tls-ring"] }

[target.'cfg(target_os = "linux")'.dependencies]
mimalloc = "0.1.52"

[dev-dependencies]
rstest = "0.28.0"

[package.metadata.deb]
extended-description = "Console client of T-Invest API: portfolio, income, taxes, risk and bond screener"
assets = [
    ["target/release/tinkoff", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/tinkoff/", "644"],
    ["LICENSE", "usr/share/doc/tinkoff/", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/tinkoff", dest = "/usr/bin/tinkoff", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/tinkoff/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/tinkoff/LICENSE", mode = "644", doc = true },
]

[profile.release]
lto = true
strip = true
panic = 'abort'

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
