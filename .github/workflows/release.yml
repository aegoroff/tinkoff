on:
  push:
    tags:
      - "v*" # Run when tag matches v*, i.e. v1.0, v20.15.10

name: Release

env:
  CARGO_TERM_COLOR: always
  RELEASE_BIN: tinkoff
  RELEASE_DIR: artifacts
  RELEASER_VER: 0.11.1

jobs:
  build:
    name: Build artifacts
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - build: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - build: macos
            os: macos-latest
            target: aarch64-apple-darwin
          - build: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v7

      - name: Query version number
        id: get_version
        shell: bash
        run: |
          echo "using version tag ${GITHUB_REF_NAME#v}"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools (Linux)
        if: matrix.build == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install musl-tools -y

      - name: Build
        shell: bash
        run: cargo build --release --target ${{ matrix.target }}
        env:
          RUSTFLAGS: ${{ matrix.build == 'windows' && '-Ctarget-feature=+crt-static' || '' }}

      - name: Create tarball
        shell: bash
        run: |
          mkdir ${{ env.RELEASE_DIR }} dist
          cp ./target/${{ matrix.target }}/release/${{ env.RELEASE_BIN }}${{ matrix.build == 'windows' && '.exe' || '' }} ./dist/
          cp ./LICENSE ./README.md ./dist/
          cd dist && tar -czf ../${{ env.RELEASE_DIR }}/${{ env.RELEASE_BIN }}-${{ steps.get_version.outputs.version }}-${{ matrix.target }}.tar.gz *

      - name: Build Debian release (x86-64)
        if: matrix.build == 'linux'
        run: |
          cargo install --locked cargo-deb
          cargo deb --no-build --target ${{ matrix.target }}
          cp ./target/${{ matrix.target }}/debian/${{ env.RELEASE_BIN }}_*.deb ./${{ env.RELEASE_DIR }}/

      - name: Build RPM release (x86-64)
        if: matrix.build == 'linux'
        run: |
          cargo install --locked cargo-generate-rpm
          cargo generate-rpm --target ${{ matrix.target }}
          cp ./target/${{ matrix.target }}/generate-rpm/${{ env.RELEASE_BIN }}-*.rpm ./${{ env.RELEASE_DIR }}/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.build }}
          path: ./${{ env.RELEASE_DIR }}

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes ./linux/* ./macos/* ./windows/*

      - name: Download Releaser
        run: |
          curl -L -o releaser.tar.gz https://github.com/aegoroff/releaser/releases/download/${{ env.RELEASER_VER }}/releaser-${{ env.RELEASER_VER }}-x86_64-unknown-linux-musl.tar.gz
          tar -xf releaser.tar.gz

      - name: Create brew formula
        run: ${{ github.workspace }}/releaser b -c ./ -b https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/ -l './linux/' -m './macos/' -u ${{ env.RELEASE_BIN }}.rb
      - name: Publish brew formula
        uses: dmnemec/copy_file_to_another_repo_action@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.GH_TOKEN }}
        with:
          github_server: "github.com"
          source_file: ${{ env.RELEASE_BIN }}.rb
          destination_repo: "aegoroff/homebrew-tap"
          user_email: "egoroff@gmail.com"
          user_name: "aegoroff"
          commit_message: "release: ${{ github.ref_name }}"

      - name: Create scoop json
        run: ${{ github.workspace }}/releaser s -c ./ -b https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/ -i './windows/' -e ${{ env.RELEASE_BIN }}.exe -u ${{ env.RELEASE_BIN }}.json
      - name: Publish scoop json
        uses: dmnemec/copy_file_to_another_repo_action@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.GH_TOKEN }}
        with:
          github_server: "github.com"
          source_file: ${{ env.RELEASE_BIN }}.json
          destination_repo: "aegoroff/scoop-bucket"
          user_email: "egoroff@gmail.com"
          user_name: "aegoroff"
          commit_message: "release: ${{ github.ref_name }}"
